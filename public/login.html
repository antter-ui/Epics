<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Sign In – The Practitioner Medical Clinic</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/design-system/tokens.css" />
  <link rel="stylesheet" href="/design-system/components.css" />
  <link rel="stylesheet" href="/css/site.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="/firebase-config.js"></script>
  <style>
    .tp-auth-wrap {
      min-height: calc(100vh - 140px);
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      background-color: var(--tp-color-bg);
    }

    .tp-auth-form-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 64px;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }

    .tp-auth-visual-col {
      background-color: var(--tp-color-alternate);
      border-left: 1px solid var(--tp-color-border);
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .tp-auth-tabs {
      display: flex;
      gap: 8px;
      background: var(--tp-color-alternate);
      padding: 6px;
      border-radius: var(--tp-radius-sm);
      border: 1px solid var(--tp-color-border);
      margin-bottom: 24px;
    }

    .tp-auth-tab {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: var(--tp-radius-sm);
      background: transparent;
      color: var(--tp-color-text);
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
    }

    .tp-auth-tab.is-active {
      background: var(--tp-color-bg);
      color: var(--tp-color-secondary);
      font-weight: 500;
      border: 1px solid var(--tp-color-border);
    }

    .tp-auth-error {
      background: var(--tp-status-cancelled-bg);
      color: var(--tp-status-cancelled-text);
      border: 1px solid var(--tp-status-cancelled-border);
      border-radius: var(--tp-radius-sm);
      padding: 11px 14px;
      font-size: 15px;
      margin-bottom: 16px;
      display: none;
    }

    @media (max-width: 960px) {
      .tp-auth-wrap {
        grid-template-columns: 1fr;
      }

      .tp-auth-form-col {
        padding: 40px 24px;
      }

      .tp-auth-visual-col {
        border-left: none;
        border-top: 1px solid var(--tp-color-border);
        padding: 40px 24px;
      }
    }
  </style>
</head>

<body>
  <div id="siteHeader"></div>

  <main class="tp-auth-wrap">
    <section class="tp-auth-form-col">
      <div style="margin-bottom:28px;">
        <h1 style="font-size:clamp(34px, 4vw, 48px); line-height:1.12;">Patient Portal Access</h1>
        <p style="margin-top:10px; font-size:17px;">
          Sign in or register to book consultations, view real-time availability, and manage your medical visits.
        </p>
      </div>

      <div class="tp-auth-tabs">
        <button type="button" class="tp-auth-tab is-active" id="tabLoginBtn" onclick="switchAuthView('login')">Sign
          In</button>
        <button type="button" class="tp-auth-tab" id="tabRegBtn" onclick="switchAuthView('register')">Create
          Account</button>
      </div>

      <form id="loginView" onsubmit="event.preventDefault(); handleLoginSubmit();">
        <div id="loginError" class="tp-auth-error"></div>
        <div class="tp-field" style="margin-bottom:16px;">
          <label class="tp-label" for="loginEmail">Email Address</label>
          <input id="loginEmail" type="email" class="tp-input" placeholder="name@example.com" required
            autocomplete="email" />
        </div>
        <div class="tp-field" style="margin-bottom:20px;">
          <label class="tp-label" for="loginPassword">Password</label>
          <input id="loginPassword" type="password" class="tp-input" placeholder="Enter your password" required
            autocomplete="current-password" />
        </div>
        <button type="submit" id="btnLoginSubmit" class="tp-btn tp-btn--accent tp-btn--full">Sign In</button>
      </form>

      <form id="registerView" style="display:none;" onsubmit="event.preventDefault(); handleRegisterSubmit();">
        <div id="regError" class="tp-auth-error"></div>
        <div class="tp-field" style="margin-bottom:16px;">
          <label class="tp-label" for="regName">Full Name</label>
          <input id="regName" type="text" class="tp-input" placeholder="Jane Doe" required autocomplete="name" />
        </div>
        <div class="tp-field" style="margin-bottom:16px;">
          <label class="tp-label" for="regEmail">Email Address</label>
          <input id="regEmail" type="email" class="tp-input" placeholder="name@example.com" required
            autocomplete="email" />
        </div>
        <div class="tp-field" style="margin-bottom:20px;">
          <label class="tp-label" for="regPassword">Create Password (min 6 characters)</label>
          <input id="regPassword" type="password" class="tp-input" placeholder="Minimum 6 characters" required
            minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" id="btnRegSubmit" class="tp-btn tp-btn--accent tp-btn--full">Create Patient
          Account</button>
      </form>

      <div
        style="display:flex; align-items:center; gap:14px; margin:24px 0; color:var(--tp-color-tertiary); font-size:14px;">
        <span style="flex:1; height:1px; background:var(--tp-color-border);"></span>
        <span>or continue with Google</span>
        <span style="flex:1; height:1px; background:var(--tp-color-border);"></span>
      </div>

      <div id="googleFallbackNotice" style="display:none; margin-bottom:14px;"></div>

      <button type="button" id="btnGoogleSignIn" class="tp-btn tp-btn--outline tp-btn--full"
        onclick="handleGoogleSignIn()">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        <span id="btnGoogleLabel">Continue with Google</span>
      </button>
      <div id="googleError" class="tp-auth-error" style="margin-top:12px;"></div>
    </section>

    <aside class="tp-auth-visual-col">
      <img src="/assets/backgrounds/hero-curve-line.svg" alt="" class="tp-hero__curve" />
      <div style="position:relative; z-index:2; max-width:480px; margin:0 auto;">
        <div
          style="border-radius:var(--tp-radius-leaf); overflow:hidden; border:1px solid var(--tp-color-border); aspect-ratio:4/3; margin-bottom:28px;">
          <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=768&h=576&fit=crop"
            alt="Physician care consultation" style="width:100%; height:100%; object-fit:cover;" />
        </div>
        <div class="tp-blockquote-card" style="padding:32px;">
          <blockquote class="tp-blockquote-card__quote" style="font-size:24px; margin-bottom:18px;">
            “Your health records, upcoming slots, and clinical summaries organized calmly in one private portal.”
          </blockquote>
          <cite class="tp-blockquote-card__cite">12 Specialists &bull; 6 Medical Departments</cite>
        </div>
      </div>
    </aside>
  </main>

  <div id="siteFooter"></div>

  <script src="/design-system/components.js"></script>
  <script src="/js/portal-core.js"></script>
  <script>
    const redirectTarget = new URLSearchParams(window.location.search).get('redirect') || '/dashboard.html';
    let firebaseReady = false;

    function initFirebase() {
      if (window.firebase && window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY') {
        try {
          if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
          firebaseReady = true;
        } catch (e) { /* ignore */ }
      }
    }

    function switchAuthView(mode) {
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('regError').style.display = 'none';
      document.getElementById('loginView').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('registerView').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('tabLoginBtn').classList.toggle('is-active', mode === 'login');
      document.getElementById('tabRegBtn').classList.toggle('is-active', mode === 'register');
    }

    async function handleLoginSubmit() {
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('btnLoginSubmit');
      errBox.style.display = 'none';
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const data = await window.PortalCore.apiRequest('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        if (data.token) localStorage.setItem('mc_token', data.token);
        window.PortalCore.showToast(`Welcome back, ${data.user.name}!`, 'success');
        setTimeout(() => { window.location.href = redirectTarget; }, 600);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleRegisterSubmit() {
      const errBox = document.getElementById('regError');
      const btn = document.getElementById('btnRegSubmit');
      errBox.style.display = 'none';
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      btn.disabled = true;
      btn.textContent = 'Creating account...';
      try {
        const data = await window.PortalCore.apiRequest('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password })
        });
        if (data.token) localStorage.setItem('mc_token', data.token);
        window.PortalCore.showToast(`Account created for ${data.user.name}!`, 'success');
        setTimeout(() => { window.location.href = redirectTarget; }, 600);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Patient Account';
      }
    }

    function showGoogleError(msg) {
      const box = document.getElementById('googleError');
      if (box) {
        box.textContent = msg;
        box.style.display = 'block';
      }
    }

    function hideGoogleError() {
      const box = document.getElementById('googleError');
      if (box) box.style.display = 'none';
    }

    async function completeFirebaseLogin(fbUser) {
      const idToken = await fbUser.getIdToken();
      const data = await window.PortalCore.apiRequest('/api/auth/firebase-login', {
        method: 'POST',
        body: JSON.stringify({ idToken })
      });
      if (data.token) localStorage.setItem('mc_token', data.token);
      window.PortalCore.showToast(`Welcome, ${data.user.name}!`, 'success');
      setTimeout(() => { window.location.href = redirectTarget; }, 500);
    }

    function formatFirebaseAuthError(err) {
      const code = (err && err.code) || '';
      if (code === 'auth/popup-closed-by-user') {
        return 'Google sign-in was cancelled because the popup window was closed.';
      }
      if (code === 'auth/unauthorized-domain') {
        return `Domain "${window.location.hostname}" is not authorized in Firebase Auth. Open http://localhost:${window.location.port || 80} or add this domain in Firebase Console -> Authentication -> Settings -> Authorized domains.`;
      }
      if (code === 'auth/operation-not-allowed') {
        return 'Google Sign-In provider is not enabled in Firebase Console for this project.';
      }
      if (code === 'auth/network-request-failed') {
        return 'Network error while reaching Google authentication servers. Please check your internet connection.';
      }
      return (err && err.message) ? `${err.message}${code ? ' (' + code + ')' : ''}` : 'Google authentication failed.';
    }

    async function handleGoogleSignIn() {
      hideGoogleError();
      if (!firebaseReady) initFirebase();

      if (!firebaseReady || !window.firebase || typeof firebase.auth !== 'function') {
        showGoogleError('Google Sign-In SDK could not load from gstatic.com. Check your internet connection or disable tracker/script blockers, or sign in with Email & Password.');
        return;
      }

      const btn = document.getElementById('btnGoogleSignIn');
      const label = document.getElementById('btnGoogleLabel');
      btn.disabled = true;
      label.textContent = 'Connecting to Google...';

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      try {
        const result = await firebase.auth().signInWithPopup(provider);
        if (result && result.user) {
          await completeFirebaseLogin(result.user);
          return;
        }
      } catch (err) {
        console.error('[GoogleAuth] Popup sign-in error:', err && err.code, err && err.message);
        const redirectFallbackCodes = [
          'auth/popup-blocked',
          'auth/cancelled-popup-request',
          'auth/operation-not-supported-in-this-environment'
        ];
        if (err && redirectFallbackCodes.includes(err.code)) {
          try {
            label.textContent = 'Redirecting to Google...';
            await firebase.auth().signInWithRedirect(provider);
            return;
          } catch (redirErr) {
            console.error('[GoogleAuth] Redirect sign-in error:', redirErr);
            showGoogleError(formatFirebaseAuthError(redirErr));
          }
        } else {
          showGoogleError(formatFirebaseAuthError(err));
        }
      } finally {
        btn.disabled = false;
        label.textContent = 'Continue with Google';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      initFirebase();

      // Complete pending Google OAuth redirect sign-in if returning from accounts.google.com
      if (firebaseReady && window.firebase && typeof firebase.auth === 'function') {
        try {
          const redirResult = await firebase.auth().getRedirectResult();
          if (redirResult && redirResult.user) {
            await completeFirebaseLogin(redirResult.user);
            return;
          }
        } catch (err) {
          console.error('[GoogleAuth] Redirect result error:', err);
          showGoogleError(formatFirebaseAuthError(err));
        }
      }

      const user = await window.PortalCore.mountLayout({ activePath: '/login.html' });
      if (user) {
        window.location.href = redirectTarget;
      }
    });
  </script>
</body>

</html>
